# 探针：只能手动触发。用 Actions 的服务器请求几条信息源和 3 篇正文样本，打印状态码和条目数，
# 确认数据中心 IP 会不会被拦。不调 AI，不提交任何东西。
name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Probe
        run: python -m dealradar.probe
