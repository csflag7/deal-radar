# 关注的品牌清单（S2）。增删品牌直接改这个文件。
# 字段：
#   name      显示名，也是新闻搜索关键词
#   aliases   其他写法（搜索时一起用）
#   category  fashion 服装鞋包 / beauty 美妆护肤 / tech 电子数码 / home 家居综合
#   shop      美国 / 加拿大官网购物链接（只在一个国家有店就只写一个）
#   domains   官方域名：来源属于这些域名才算“已官宣”
#   promo     官网促销页（可选，S2 实测能抓到才保留）

categories:
  - { id: fashion, name: 服装鞋包, color: "#3b6fd4" }
  - { id: beauty,  name: 美妆护肤, color: "#c2417a" }
  - { id: tech,    name: 电子数码, color: "#1f8a70" }
  - { id: home,    name: 家居综合, color: "#b7791f" }

brands:
